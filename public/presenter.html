<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Timer Pro | Presenter</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            cursor: none; margin: 0; padding: 0; border: 0;
        }
        .stage {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
        }
        .timer {
            position: absolute;
            transform: translate(-50%, -50%);
            font-weight: 900;
            letter-spacing: -0.02em;
            transition: color 0.3s;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }
        .message {
            position: absolute;
            transform: translateX(-50%);
            color: #fff;
            font-weight: 600;
            opacity: 0.9;
            text-align: center;
            max-width: 90%;
            transition: opacity 0.3s;
        }
        .message.hidden { opacity: 0; }
        .session-name {
            position: absolute;
            transform: translateX(-50%);
            color: #fff;
            font-weight: 700;
            text-align: center;
            max-width: 88%;
            line-height: 1.15;
            letter-spacing: 0.01em;
        }
        .ring {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .ring circle {
            fill: none;
            stroke-width: 3;
            transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
        }
        .conn-banner {
            position: fixed;
            top: 12px; right: 12px;
            background: rgba(239, 68, 68, 0.92);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            z-index: 9999;
            display: none;
        }
        .conn-banner.visible { display: block; }
        .logo-display {
            width: 100%; height: 100%;
            object-fit: contain; opacity: 0.85;
        }
        .idle-text {
            font-size: 8vw; font-weight: 300;
            opacity: 0.6; letter-spacing: 0.1em;
        }
        .loadbar-wrap {
            position: fixed;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .loadbar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #10b981, #22d3ee);
            box-shadow: 0 0 16px rgba(16,185,129,0.6);
            transition: width 0.5s linear, background 0.3s;
        }
        .loadbar-fill.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); box-shadow: 0 0 16px rgba(245,158,11,0.6); }
        .loadbar-fill.danger { background: linear-gradient(90deg, #ef4444, #f87171); box-shadow: 0 0 16px rgba(239,68,68,0.7); }
        .semaforo {
            position: fixed;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid #1e293b;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .lamp {
            border-radius: 50%;
            background: #1e293b;
            transition: all .3s;
            opacity: 0.35;
        }
        .lamp.on-green { background: radial-gradient(circle at 35% 30%, #34d399, #10b981); box-shadow: 0 0 24px rgba(16,185,129,0.8); opacity: 1; }
        .lamp.on-amber { background: radial-gradient(circle at 35% 30%, #fbbf24, #f59e0b); box-shadow: 0 0 24px rgba(245,158,11,0.8); opacity: 1; }
        .lamp.on-red { background: radial-gradient(circle at 35% 30%, #f87171, #ef4444); box-shadow: 0 0 28px rgba(239,68,68,0.9); opacity: 1; animation: blink 0.6s infinite; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.25; } }
    </style>
</head>
<body>
    <div class="stage" id="stage"></div>
    <div class="conn-banner" id="conn-banner">CONNECTION LOST — RECONNECTING...</div>

    <script>
        var socket = io();
        var stage = document.getElementById('stage');
        var currentSettings = {};
        var currentState = null;
        var audioElements = {};
        var builtMode = null;

        function getTimerEl() { return document.getElementById('timer'); }
        function getMsgEl() { return document.getElementById('msg'); }

        function applyFont(el, settings) {
            if (settings.fontFamily) el.style.fontFamily = settings.fontFamily;
        }

        function formatTime(seconds, settings) {
            var abs = Math.abs(seconds);
            var sign = seconds < 0 ? '-' : '';
            var h = Math.floor(abs / 3600);
            var m = Math.floor((abs % 3600) / 60);
            var s = abs % 60;
            if ((settings.showHours !== false) || h > 0) {
                if (settings.showSeconds !== false) {
                    return sign + h.toString().padStart(2, '0') + ':' +
                           m.toString().padStart(2, '0') + ':' +
                           s.toString().padStart(2, '0');
                }
                return sign + h.toString().padStart(2, '0') + ':' +
                       m.toString().padStart(2, '0');
            }
            if (settings.showSeconds !== false) {
                return sign + m.toString().padStart(2, '0') + ':' +
                       s.toString().padStart(2, '0');
            }
            return sign + m.toString().padStart(2, '0');
        }

        function formatTimeOfDay() {
            var now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' +
                   now.getMinutes().toString().padStart(2, '0') + ':' +
                   now.getSeconds().toString().padStart(2, '0');
        }

        function getTimerSize(cfg) {
            return cfg.timerSize !== undefined ? cfg.timerSize : 22;
        }

        function renderCountdown(s) {
            var el = getTimerEl();
            if (!el) return;
            var cfg = s.settings || currentSettings;
            el.style.fontSize = getTimerSize(cfg) + 'vw';

            var color = cfg.colorNormal || '#10b981';
            if (s.alertLevel === 'expired') {
                color = cfg.colorExpired || '#ef4444';
                if (s.isRunning) {
                    var flash = Math.floor(Date.now() / 500) % 2 === 0;
                    color = flash ? (cfg.colorExpired || '#ef4444') : '#000';
                }
            } else if (s.alertLevel === 'danger') {
                color = cfg.colorDanger || '#f97316';
            } else if (s.alertLevel === 'warning') {
                color = cfg.colorWarning || '#f59e0b';
            }

            el.textContent = formatTime(s.activeTime, cfg);
            el.style.color = color;
        }

        function renderCountUp(s) {
            var el = getTimerEl();
            if (!el) return;
            var cfg = s.settings || currentSettings;
            el.style.fontSize = getTimerSize(cfg) + 'vw';
            el.textContent = formatTime(s.activeTime, cfg);
            el.style.color = cfg.colorNormal || '#10b981';
        }

        function positionTimer(el, cfg) {
            el.style.left = (cfg.timerX !== undefined ? cfg.timerX : 50) + '%';
            el.style.top = (cfg.timerY !== undefined ? cfg.timerY : 46) + '%';
        }

        function positionMessage(el, cfg) {
            el.style.left = (cfg.timerX !== undefined ? cfg.timerX : 50) + '%';
            var y = (cfg.timerY !== undefined ? cfg.timerY : 46);
            el.style.top = (y + 13) + '%';
        }

        function createLoadbar() {
            var wrap = document.createElement('div');
            wrap.className = 'loadbar-wrap';
            wrap.id = 'loadbar';

            var fill = document.createElement('div');
            fill.className = 'loadbar-fill';
            fill.id = 'loadbar-fill';

            wrap.appendChild(fill);
            document.body.appendChild(wrap);
            return wrap;
        }

        function updateLoadbar(s) {
            var wrap = document.getElementById('loadbar');
            if (!wrap) return;
            var cfg = s.settings || {};
            wrap.style.left = (cfg.barX !== undefined ? cfg.barX : 10) + '%';
            wrap.style.top = (cfg.barY !== undefined ? cfg.barY : 88) + '%';
            wrap.style.width = (cfg.barWidth !== undefined ? cfg.barWidth : 80) + '%';
            wrap.style.height = (cfg.barHeight !== undefined ? cfg.barHeight : 14) + 'px';

            var fill = document.getElementById('loadbar-fill');
            if (!fill) return;
            fill.style.width = calcBarPct(s) + '%';
            fill.className = 'loadbar-fill';
            if (s.alertLevel === 'expired' || s.alertLevel === 'danger') fill.classList.add('danger');
            else if (s.alertLevel === 'warning') fill.classList.add('warning');
        }

        function createSemaforo() {
            var wrap = document.createElement('div');
            wrap.className = 'semaforo';
            wrap.id = 'semaforo';

            ['red', 'amber', 'green'].forEach(function (color) {
                var lamp = document.createElement('div');
                lamp.className = 'lamp';
                lamp.id = 'lamp-' + color;
                wrap.appendChild(lamp);
            });

            document.body.appendChild(wrap);
            return wrap;
        }

        function updateSemaforo(s) {
            var wrap = document.getElementById('semaforo');
            if (!wrap) return;
            var cfg = s.settings || {};
            var size = cfg.semaforoSize !== undefined ? cfg.semaforoSize : 46;
            wrap.style.left = (cfg.semaforoX !== undefined ? cfg.semaforoX : 50) + '%';
            wrap.style.top = (cfg.semaforoY !== undefined ? cfg.semaforoY : 88) + '%';
            wrap.style.gap = Math.round(size * 0.26) + 'px';

            ['red', 'amber', 'green'].forEach(function (color) {
                var lamp = document.getElementById('lamp-' + color);
                if (!lamp) return;
                lamp.style.width = size + 'px';
                lamp.style.height = size + 'px';
                lamp.className = 'lamp';
                if (color === 'red' && (s.alertLevel === 'expired' || s.alertLevel === 'danger')) lamp.classList.add('on-red');
                else if (color === 'amber' && s.alertLevel === 'warning') lamp.classList.add('on-amber');
                else if (color === 'green' && s.alertLevel === 'normal') lamp.classList.add('on-green');
            });
        }

        function updateIndicator(s) {
            var cfg = s.settings || {};
            var ind = cfg.statusIndicator || 'none';

            var bar = document.getElementById('loadbar');
            var sem = document.getElementById('semaforo');

            if (ind === 'bar' || ind === 'both') {
                if (!bar) bar = createLoadbar();
                updateLoadbar(s);
            } else if (bar && bar.parentNode) {
                bar.parentNode.removeChild(bar);
            }

            if (ind === 'semaforo' || ind === 'both') {
                if (!sem) sem = createSemaforo();
                updateSemaforo(s);
            } else if (sem && sem.parentNode) {
                sem.parentNode.removeChild(sem);
            }
        }

        function calcBarPct(s) {
            if (s.mode === 'countdown') {
                if (s.initialTime <= 0) return 100;
                var pct = (s.activeTime / s.initialTime) * 100;
                return Math.max(0, Math.min(100, pct));
            }
            return 100;
        }

        function applyTransparency(settings) {
            var mode = (settings && settings.bgMode) || 'color';
            var bg = (settings && settings.bgColor) || '#000000';
            if (mode === 'transparent') {
                document.documentElement.style.background = 'transparent';
                document.body.style.background = 'transparent';
                stage.style.background = 'transparent';
                stage.style.webkitAppRegion = 'drag';
            } else {
                document.documentElement.style.background = bg;
                document.body.style.background = bg;
                stage.style.background = bg;
                stage.style.webkitAppRegion = 'no-drag';
            }
        }

        function buildStage(s) {
            currentState = s;
            currentSettings = s.settings || {};
            applyTransparency(currentSettings);

            if (builtMode !== s.mode) {
                stage.innerHTML = '';

                if (s.mode === 'logo') {
                    var img = document.createElement('img');
                    img.id = 'logo-img';
                    img.className = 'logo-display';
                    stage.appendChild(img);
                } else if (s.mode === 'agenda') {
                    var sess = document.createElement('div');
                    sess.className = 'session-name';
                    sess.id = 'session-name';
                    sess.style.fontSize = '5vw';
                    stage.appendChild(sess);

                    var agTimer = document.createElement('div');
                    agTimer.className = 'timer';
                    agTimer.id = 'timer';
                    stage.appendChild(agTimer);

                    var agMsg = document.createElement('div');
                    agMsg.className = 'message';
                    agMsg.id = 'msg';
                    agMsg.style.fontSize = '4vw';
                    stage.appendChild(agMsg);
                } else if (s.mode === 'timeofday') {
                    var tod = document.createElement('div');
                    tod.className = 'timer';
                    tod.id = 'timer';
                    stage.appendChild(tod);

                    var msgDiv2 = document.createElement('div');
                    msgDiv2.className = 'message';
                    msgDiv2.id = 'msg';
                    msgDiv2.style.fontSize = '4vw';
                    stage.appendChild(msgDiv2);
                } else {
                    var timerDiv = document.createElement('div');
                    timerDiv.className = 'timer';
                    timerDiv.id = 'timer';
                    applyFont(timerDiv, currentSettings);
                    stage.appendChild(timerDiv);

                    if (s.mode === 'prestart') {
                        var cap = document.createElement('div');
                        cap.className = 'session-name';
                        cap.id = 'prestart-caption';
                        cap.style.fontSize = '4vw';
                        stage.appendChild(cap);
                    }

                    if ((s.settings && s.settings.ringEnabled) && s.mode !== 'countup') {
                        var ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        ring.setAttribute('class', 'ring');
                        ring.setAttribute('id', 'ring');
                        ring.setAttribute('viewBox', '0 0 100 100');
                        var circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        circ.setAttribute('cx', '50');
                        circ.setAttribute('cy', '50');
                        circ.setAttribute('r', '47');
                        circ.setAttribute('stroke-dasharray', '295.3');
                        ring.appendChild(circ);
                        stage.appendChild(ring);
                    }

                    var msgDiv = document.createElement('div');
                    msgDiv.className = 'message';
                    msgDiv.id = 'msg';
                    msgDiv.style.fontSize = '4vw';
                    stage.appendChild(msgDiv);
                }

                builtMode = s.mode;
            }

            updateStage(s);
        }

        function updateStage(s) {
            if (s.mode === 'logo') {
                var img = document.getElementById('logo-img');
                if (img) {
                    if (s.logoData) img.src = s.logoData;
                    else img.src = '/images/testpattern.png';
                    img.style.objectFit = (s.settings && s.settings.logoFit) || 'contain';
                }
                updateIndicator(s);
                return;
            }

            var el = getTimerEl();
            if (el) {
                var cfg = s.settings || {};
                el.style.fontSize = getTimerSize(cfg) + 'vw';
                applyFont(el, cfg);
                positionTimer(el, cfg);

                if (s.mode === 'agenda') {
                    el.textContent = formatTime(s.agendaTimeLeft !== undefined ? s.agendaTimeLeft : 0, cfg);
                    el.style.color = cfg.colorNormal || '#10b981';
                } else if (s.mode === 'timeofday') {
                    el.textContent = formatTimeOfDay();
                    el.style.color = cfg.colorNormal || '#10b981';
                } else if (s.mode === 'countdown' || s.mode === 'prestart') {
                    renderCountdown(s);
                } else {
                    renderCountUp(s);
                }
            }

            var cap = document.getElementById('prestart-caption');
            if (cap) {
                cap.textContent = (s.settings && s.settings.prestartLabel) || 'STARTS IN';
                cap.style.left = (currentSettings.timerX !== undefined ? currentSettings.timerX : 50) + '%';
                cap.style.top = (currentSettings.timerY !== undefined ? Math.max(6, currentSettings.timerY - 18) : 28) + '%';
            }

            var ring = document.getElementById('ring');
            if (ring) {
                var cfg3 = s.settings || {};
                ring.style.left = (cfg3.timerX !== undefined ? cfg3.timerX : 50) + '%';
                ring.style.top = (cfg3.timerY !== undefined ? cfg3.timerY : 46) + '%';
                var ringSize = getTimerSize(cfg3) * 7.2;
                ring.style.width = ringSize + 'vw';
                ring.style.height = ringSize + 'vw';
                var pct = 1;
                if (s.mode !== 'countup' && s.initialTime > 0) {
                    pct = Math.max(0, Math.min(1, s.activeTime / s.initialTime));
                }
                var circ = ring.querySelector('circle');
                if (circ) {
                    circ.setAttribute('stroke-dashoffset', String(295.3 * (1 - pct)));
                    var ringColor = cfg3.colorNormal || '#10b981';
                    if (s.alertLevel === 'expired') ringColor = cfg3.colorExpired || '#ef4444';
                    else if (s.alertLevel === 'danger') ringColor = cfg3.colorDanger || '#f97316';
                    else if (s.alertLevel === 'warning') ringColor = cfg3.colorWarning || '#f59e0b';
                    circ.setAttribute('stroke', ringColor);
                }
            }

            var sess = document.getElementById('session-name');
            if (sess) {
                sess.textContent = s.agendaName || '';
                sess.style.top = (currentSettings.timerY !== undefined ? Math.max(6, currentSettings.timerY - 20) : 26) + '%';
            }

            var msg = getMsgEl();
            if (msg) {
                var cfg2 = s.settings || {};
                positionMessage(msg, cfg2);
                if (s.showMessage && s.message) {
                    msg.textContent = s.message;
                    msg.classList.remove('hidden');
                } else {
                    msg.classList.add('hidden');
                }
            }

            updateIndicator(s);
        }

        // --- Audio System ---
        function playAudio(type) {
            var settings = currentSettings || {};
            if (type === 'end' && settings.audioEndEnabled === false) return;
            if (type === 'warning' && settings.audioWarningEnabled === false) return;
            if (type === 'danger' && settings.audioDangerEnabled === false) return;
            if (!audioElements[type]) return;

            var audio = audioElements[type];
            audio.currentTime = 0;
            audio.play().catch(function() {});
        }

        function updateAudioElements(data) {
            ['end', 'warning', 'danger'].forEach(function (type) {
                var key = type === 'end' ? 'audioEnd' : (type === 'warning' ? 'audioWarning' : 'audioDanger');
                if (data[key]) {
                    if (audioElements[type]) {
                        audioElements[type].src = data[key];
                    } else {
                        audioElements[type] = new Audio(data[key]);
                    }
                } else if (audioElements[type]) {
                    audioElements[type].src = '';
                }
            });
        }

        socket.on('stateUpdate', function(s) {
            buildStage(s);
        });

        socket.on('settingsUpdate', function(s) {
            currentSettings = s;
            if (currentState) {
                currentState.settings = s;
                buildStage(currentState);
            }
        });

        socket.on('audioUpdate', function(data) {
            updateAudioElements(data);
        });

        socket.on('audioTrigger', function(data) {
            if (data.type === 'end') playAudio('end');
            if (data.type === 'warning') playAudio('warning');
            if (data.type === 'danger') {
                if (audioElements['danger'] && audioElements['danger'].src) {
                    playAudio('danger');
                } else {
                    playAudio('warning');
                }
            }
        });

        // Connection status banner
        var connBanner = document.getElementById('conn-banner');
        socket.on('disconnect', function() {
            if (connBanner) connBanner.classList.add('visible');
        });
        socket.on('connect', function() {
            if (connBanner) connBanner.classList.remove('visible');
        });

        // Time-of-day tick
        setInterval(function() {
            var el = getTimerEl();
            if (el && currentState && currentState.mode === 'timeofday') {
                el.textContent = formatTimeOfDay();
            }
        }, 1000);

        // Expired flash tick (in-place, only touches the timer color)
        setInterval(function() {
            if (currentState && currentState.mode === 'countdown' &&
                currentState.alertLevel === 'expired' && currentState.isRunning) {
                updateStage(currentState);
            }
        }, 500);
    </script>
</body>
</html>
