<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Timer Pro | Presenter</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            cursor: none; margin: 0; padding: 0; border: 0;
        }
        .stage {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000;
        }
        .timer {
            font-weight: 900;
            letter-spacing: -0.02em;
            transition: color 0.3s;
            line-height: 1;
        }
        .message {
            color: #fff;
            font-weight: 600;
            opacity: 0.9;
            text-align: center;
            max-width: 90%;
            transition: opacity 0.3s;
        }
        .message.hidden { opacity: 0; }
        .logo-display {
            width: 100%; height: 100%;
            object-fit: contain; opacity: 0.85;
        }
        .idle-text {
            font-size: 8vw; font-weight: 300;
            opacity: 0.6; letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage"></div>

    <script>
        var socket = io();
        var stage = document.getElementById('stage');
        var currentSettings = {};
        var currentState = null;
        var audioElements = {};

        function getTimerEl() { return document.getElementById('timer'); }
        function getMsgEl() { return document.getElementById('msg'); }

        function applyFont(el, settings) {
            if (settings.fontFamily) el.style.fontFamily = settings.fontFamily;
        }

        function formatTime(seconds, settings) {
            var abs = Math.abs(seconds);
            var sign = seconds < 0 ? '-' : '';
            var h = Math.floor(abs / 3600);
            var m = Math.floor((abs % 3600) / 60);
            var s = abs % 60;
            if ((settings.showHours !== false) || h > 0) {
                if (settings.showSeconds !== false) {
                    return sign + h.toString().padStart(2, '0') + ':' +
                           m.toString().padStart(2, '0') + ':' +
                           s.toString().padStart(2, '0');
                }
                return sign + h.toString().padStart(2, '0') + ':' +
                       m.toString().padStart(2, '0');
            }
            if (settings.showSeconds !== false) {
                return sign + m.toString().padStart(2, '0') + ':' +
                       s.toString().padStart(2, '0');
            }
            return sign + m.toString().padStart(2, '0');
        }

        function formatTimeOfDay() {
            var now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' +
                   now.getMinutes().toString().padStart(2, '0') + ':' +
                   now.getSeconds().toString().padStart(2, '0');
        }

        function renderCountdown(s) {
            var el = getTimerEl();
            if (!el) return;
            var cfg = s.settings || currentSettings;
            var h = Math.floor(Math.abs(s.activeTime) / 3600);
            if ((cfg.showHours !== false) || h > 0) {
                el.style.fontSize = '14vw';
            } else {
                el.style.fontSize = '22vw';
            }

            var color = cfg.colorNormal || '#10b981';
            if (s.alertLevel === 'expired') {
                color = cfg.colorExpired || '#ef4444';
                if (s.isRunning) {
                    var flash = Math.floor(Date.now() / 500) % 2 === 0;
                    color = flash ? (cfg.colorExpired || '#ef4444') : '#000';
                }
            } else if (s.alertLevel === 'danger') {
                color = cfg.colorDanger || '#f97316';
            } else if (s.alertLevel === 'warning') {
                color = cfg.colorWarning || '#f59e0b';
            }

            el.textContent = formatTime(s.activeTime, cfg);
            el.style.color = color;
        }

        function renderCountUp(s) {
            var el = getTimerEl();
            if (!el) return;
            var cfg = s.settings || currentSettings;
            if (cfg.showHours || Math.abs(s.activeTime) >= 3600) {
                el.style.fontSize = '14vw';
            } else {
                el.style.fontSize = '22vw';
            }
            el.textContent = formatTime(s.activeTime, cfg);
            el.style.color = cfg.colorNormal || '#10b981';
        }

        function buildStage(s) {
            stage.innerHTML = '';
            currentState = s;
            currentSettings = s.settings || {};

            if (s.mode === 'logo') {
                if (s.logoData) {
                    var img = document.createElement('img');
                    img.src = s.logoData;
                    img.className = 'logo-display';
                    var fit = (s.settings && s.settings.logoFit) || 'contain';
                    img.style.objectFit = fit;
                    stage.appendChild(img);
                } else {
                    var idle = document.createElement('div');
                    idle.className = 'idle-text';
                    idle.style.color = currentSettings.colorNormal || '#10b981';
                    idle.textContent = 'Smart Timer Pro';
                    stage.appendChild(idle);
                }
                return;
            }

            if (s.mode === 'timeofday') {
                var tod = document.createElement('div');
                tod.className = 'timer';
                tod.id = 'timer';
                tod.textContent = formatTimeOfDay();
                tod.style.color = currentSettings.colorNormal || '#10b981';
                tod.style.fontSize = '12vw';
                applyFont(tod, currentSettings);
                stage.appendChild(tod);

                var msgDiv2 = document.createElement('div');
                msgDiv2.className = 'message';
                msgDiv2.id = 'msg';
                msgDiv2.style.fontSize = '4vw';
                msgDiv2.style.marginTop = '2vh';
                if (s.showMessage && s.message) {
                    msgDiv2.textContent = s.message;
                } else {
                    msgDiv2.classList.add('hidden');
                }
                stage.appendChild(msgDiv2);
                return;
            }

            // countdown or countup
            var timerDiv = document.createElement('div');
            timerDiv.className = 'timer';
            timerDiv.id = 'timer';
            applyFont(timerDiv, currentSettings);
            stage.appendChild(timerDiv);

            var msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.id = 'msg';
            msgDiv.style.fontSize = '4vw';
            msgDiv.style.marginTop = '2vh';
            stage.appendChild(msgDiv);

            if (s.mode === 'countdown') {
                renderCountdown(s);
            } else {
                renderCountUp(s);
            }

            if (s.showMessage && s.message) {
                msgDiv.textContent = s.message;
                msgDiv.classList.remove('hidden');
            } else {
                msgDiv.classList.add('hidden');
            }
        }

        // --- Audio System ---
        function playAudio(type) {
            var settings = currentSettings || {};
            if (type === 'end' && settings.audioEndEnabled === false) return;
            if (type === 'warning' && settings.audioWarningEnabled === false) return;
            if (!audioElements[type]) return;

            var audio = audioElements[type];
            audio.currentTime = 0;
            audio.play().catch(function() {});
        }

        function updateAudioElements(data) {
            if (data.audioEnd) {
                if (audioElements['end']) {
                    audioElements['end'].src = data.audioEnd;
                } else {
                    var a = new Audio(data.audioEnd);
                    audioElements['end'] = a;
                }
            } else {
                if (audioElements['end']) {
                    audioElements['end'].src = '';
                }
            }
            if (data.audioWarning) {
                if (audioElements['warning']) {
                    audioElements['warning'].src = data.audioWarning;
                } else {
                    var a = new Audio(data.audioWarning);
                    audioElements['warning'] = a;
                }
            } else {
                if (audioElements['warning']) {
                    audioElements['warning'].src = '';
                }
            }
        }

        socket.on('stateUpdate', function(s) {
            buildStage(s);
        });

        socket.on('settingsUpdate', function(s) {
            currentSettings = s;
            if (currentState) {
                currentState.settings = s;
                buildStage(currentState);
            }
        });

        socket.on('audioUpdate', function(data) {
            updateAudioElements(data);
        });

        socket.on('audioTrigger', function(data) {
            if (data.type === 'end') playAudio('end');
            if (data.type === 'warning' || data.type === 'danger') playAudio('warning');
        });

        // Time-of-day tick
        setInterval(function() {
            var el = getTimerEl();
            if (el && currentState && currentState.mode === 'timeofday') {
                el.textContent = formatTimeOfDay();
            }
        }, 1000);

        // Expired flash tick
        setInterval(function() {
            if (currentState && currentState.mode === 'countdown' &&
                currentState.alertLevel === 'expired' && currentState.isRunning) {
                buildStage(currentState);
            }
        }, 500);
    </script>
</body>
</html>
