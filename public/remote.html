<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Timer Pro | Remote</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #f3f4f6;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            padding: 20px; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .time {
            font-family: 'Courier New', monospace;
            font-size: 22vw; font-weight: 900; color: #10b981;
            line-height: 1; transition: color 0.3s; text-align: center;
        }
        .session { font-size: 5vw; font-weight: 700; color: #9ca3af; text-align: center; min-height: 1.2em; }
        .row { display: flex; gap: 12px; width: 100%; max-width: 640px; }
        button {
            flex: 1; border: none; border-radius: 16px; padding: 26px 10px;
            font-size: 6vw; font-weight: 800; color: #fff; cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            letter-spacing: 0.5px;
        }
        button:active { transform: scale(0.95); }
        .go { background: #10b981; }
        .go:active { background: #059669; }
        .pause { background: #f59e0b; }
        .pause:active { background: #d97706; }
        .reset { background: #334155; color: #cbd5e1; }
        .reset:active { background: #475569; }
        .sm { background: #1f2937; color: #e5e7eb; }
        .sm:active { background: #374151; }
        .msg { background: #0ea5e9; }
        .msg:active { background: #0284c7; }
        .hidden { display: none; }
        .clock-top {
            position: fixed; top: 12px; right: 16px; color: #fff;
            font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700;
            opacity: 0.9; display: none;
        }
        .clock-top.visible { display: block; }
        .agenda-bar {
            width: 100%; max-width: 640px; height: 6px; background: #1f2937;
            border-radius: 999px; overflow: hidden; display: none;
        }
        .agenda-bar.visible { display: block; }
        .agenda-bar-fill {
            height: 100%; background: #10b981; border-radius: 999px;
            transition: width 0.5s linear;
        }
        .banner {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95); color: #fff;
            padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 700;
            display: none; z-index: 99;
        }
        .banner.visible { display: block; }
    </style>
</head>
<body>
    <div class="banner" id="banner">CONNECTION LOST — RECONNECTING...</div>
    <div class="clock-top" id="clock-top"></div>

    <div class="session" id="session"></div>
    <div class="time" id="time">--:--</div>
    <div class="agenda-bar" id="agenda-bar"><div class="agenda-bar-fill" id="agenda-bar-fill"></div></div>

    <div class="row">
        <button class="go" id="btn-go" onclick="cmd('toggle_playback')">GO</button>
        <button class="pause hidden" id="btn-pause" onclick="cmd('toggle_playback')">PAUSE</button>
        <button class="reset" onclick="cmd('reset')">RESET</button>
    </div>
    <div class="row">
        <button class="sm" onclick="cmd('add?sec=60')">+1m</button>
        <button class="sm" onclick="cmd('add?sec=-60')">-1m</button>
        <button class="msg" onclick="cmd('message/toggle')">MSG</button>
    </div>

    <script>
        var socket = io();
        var apiPin = localStorage.getItem('stp_pin') || '';
        var currentState = null;

        function cmd(name) {
            var url = '/api/' + name + (apiPin ? (name.indexOf('?') >= 0 ? '&' : '?') + 'pin=' + encodeURIComponent(apiPin) : '');
            fetch(url).then(function(r) {
                if (r.status === 401) {
                    var pin = prompt('PIN required:');
                    if (!pin) return;
                    apiPin = pin;
                    localStorage.setItem('stp_pin', pin);
                    cmd(name);
                }
            });
        }

        function formatTime(seconds, cfg) {
            var abs = Math.abs(seconds || 0);
            var sign = seconds < 0 ? '-' : '';
            var h = Math.floor(abs / 3600);
            var m = Math.floor((abs % 3600) / 60);
            var s = abs % 60;
            if ((cfg.showHours !== false) || h > 0) {
                if (cfg.showSeconds !== false) return sign + pad(h) + ':' + pad(m) + ':' + pad(s);
                return sign + pad(h) + ':' + pad(m);
            }
            if (cfg.showSeconds !== false) return sign + pad(m) + ':' + pad(s);
            return sign + pad(m);
        }
        function pad(n) { return String(n).padStart(2, '0'); }

        function render(s) {
            currentState = s;
            var cfg = s.settings || {};
            var el = document.getElementById('time');
            if (s.mode === 'timeofday') {
                var d = new Date();
                el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
            } else if (s.mode === 'logo') {
                el.textContent = 'LOGO';
            } else if (s.mode === 'agenda') {
                el.textContent = formatTime(s.agendaTimeLeft, cfg);
                document.getElementById('session').textContent = s.agendaName || '';
            } else {
                el.textContent = formatTime(s.activeTime, cfg);
                document.getElementById('session').textContent = '';
            }
            if (s.mode === 'countdown' || s.mode === 'prestart') {
                if (s.alertLevel === 'expired') el.style.color = cfg.colorExpired || '#ef4444';
                else if (s.alertLevel === 'danger') el.style.color = cfg.colorDanger || '#f97316';
                else if (s.alertLevel === 'warning') el.style.color = cfg.colorWarning || '#f59e0b';
                else el.style.color = cfg.colorNormal || '#10b981';
            } else {
                el.style.color = cfg.colorNormal || '#10b981';
            }
            document.getElementById('btn-go').classList.toggle('hidden', !!s.isRunning);
            document.getElementById('btn-pause').classList.toggle('hidden', !s.isRunning);

            var clock = document.getElementById('clock-top');
            if (cfg.showClock && (s.mode === 'countdown' || s.mode === 'countup' || s.mode === 'prestart')) {
                clock.classList.add('visible');
                var d = new Date();
                clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
            } else {
                clock.classList.remove('visible');
            }

            var agBar = document.getElementById('agenda-bar');
            var agFill = document.getElementById('agenda-bar-fill');
            if (s.agendaActive && s.mode === 'agenda' && s.agendaTotal > 0) {
                agBar.classList.add('visible');
                var pct = Math.max(0, Math.min(100, (s.agendaTimeLeft / s.agendaTotal) * 100));
                agFill.style.width = pct + '%';
            } else {
                agBar.classList.remove('visible');
            }
        }

        socket.on('stateUpdate', render);
        socket.on('disconnect', function() { document.getElementById('banner').classList.add('visible'); });
        socket.on('connect', function() { document.getElementById('banner').classList.remove('visible'); });

        setInterval(function() {
            if (currentState && currentState.mode === 'timeofday') render(currentState);
            var clock = document.getElementById('clock-top');
            if (clock && clock.classList.contains('visible')) {
                var d = new Date();
                clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
            }
        }, 1000);
    </script>
</body>
</html>
