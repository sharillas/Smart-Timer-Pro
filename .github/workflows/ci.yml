name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Build macOS (Intel x64)
        run: npx electron-builder --mac zip --x64 --publish never

      - name: Build macOS (Apple Silicon arm64)
        run: npx electron-builder --mac zip --arm64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/*-mac.zip
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Build installer
        run: node scripts/build-installer.js

      - name: Build Companion module
        working-directory: companion/smart-timer-pro
        run: npm ci && node scripts/package.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Timer Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Smart Timer Pro Setup*.exe
            dist/Smart Timer Pro Setup*.exe.blockmap
            dist/latest.yml
            companion/smart-timer-pro/companion-module-smart-timer-pro-*.tgz
